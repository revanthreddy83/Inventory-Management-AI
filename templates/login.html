<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailAI - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #1C1C1E;
            color: #F2F2F2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 1rem;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(15,169,88,0.08) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -50%; left: -20%;
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(15,169,88,0.06) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .login-container { width: 100%; max-width: 480px; position: relative; z-index: 1; }
        .logo { text-align: center; margin-bottom: 3rem; }
        .logo-text { font-family: 'DM Serif Display', serif; font-size: 2.5rem; font-weight: 400; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
        .logo-text span { color: #0FA958; }
        .logo-tagline { font-size: 0.95rem; color: rgba(242,242,242,0.5); font-weight: 300; letter-spacing: 0.5px; }
        .login-card {
            background: #2A2A2C;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(58,58,60,0.5);
            position: relative;
            transition: all 0.3s ease;
        }
        .login-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); border-color: rgba(15,169,88,0.3); }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #0FA958 0%, rgba(15,169,88,0.3) 100%);
            border-radius: 16px 16px 0 0;
        }
        .card-header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid rgba(58,58,60,0.5); }
        .card-title { font-family: 'DM Serif Display', serif; font-size: 1.75rem; font-weight: 400; letter-spacing: -0.3px; margin-bottom: 0.5rem; }
        .card-subtitle { font-size: 0.9rem; color: rgba(242,242,242,0.6); font-weight: 300; }
        .form-group { margin-bottom: 1.75rem; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; color: rgba(242,242,242,0.7); }
        .form-input {
            width: 100%; padding: 1rem 1.25rem;
            background: rgba(58,58,60,0.3);
            border: 1px solid rgba(58,58,60,0.5);
            border-radius: 10px;
            color: #F2F2F2; font-size: 1rem;
            font-family: 'IBM Plex Sans', sans-serif;
            transition: all 0.3s ease; outline: none;
        }
        .form-input::placeholder { color: rgba(242,242,242,0.3); }
        .form-input:focus { background: rgba(58,58,60,0.5); border-color: #0FA958; box-shadow: 0 0 0 3px rgba(15,169,88,0.1); }
        .form-input:hover:not(:focus) { border-color: rgba(15,169,88,0.3); }
        .form-footer { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #0FA958; }
        .checkbox-label { font-size: 0.875rem; color: rgba(242,242,242,0.7); cursor: pointer; user-select: none; }
        .forgot-link { font-size: 0.875rem; color: #0FA958; text-decoration: none; transition: color 0.3s; font-weight: 500; }
        .forgot-link:hover { color: #12C96B; }
        .btn-primary {
            width: 100%;
            background: #0FA958; color: #F2F2F2;
            border: none; padding: 1.1rem 2rem;
            border-radius: 10px; font-weight: 600;
            font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'IBM Plex Sans', sans-serif;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(15,169,88,0.3);
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        }
        .btn-primary:hover { background: #12C96B; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(15,169,88,0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .security-badge {
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; margin-top: 2rem; padding-top: 2rem;
            border-top: 1px solid rgba(58,58,60,0.5);
            font-size: 0.8rem; color: rgba(242,242,242,0.5);
        }
        .security-icon { width: 16px; height: 16px; color: #0FA958; }
        .footer-text { text-align: center; margin-top: 2rem; font-size: 0.85rem; color: rgba(242,242,242,0.4); }
        .footer-text a { color: #0FA958; text-decoration: none; }
        .footer-text a:hover { color: #12C96B; }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed; inset: 0;
            background: #1C1C1E;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        .loading-overlay.active { display: flex; }
        .loading-logo { font-family: 'DM Serif Display', serif; font-size: 2rem; }
        .loading-logo span { color: #0FA958; }
        .loading-bar-track {
            width: 220px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px; overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%; width: 0%;
            background: #0FA958;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        .loading-text { font-size: 0.85rem; color: rgba(242,242,242,0.4); letter-spacing: 0.05em; }

        .btn-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .login-card { padding: 2rem 1.5rem; }
            .logo-text { font-size: 2rem; }
            .form-footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- Full-screen loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-logo">Retail<span>AI</span></div>
        <div class="loading-bar-track"><div class="loading-bar-fill" id="loadingBar"></div></div>
        <div class="loading-text" id="loadingText">Authenticating…</div>
    </div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-text">Retail<span>AI</span></div>
            <div class="logo-tagline">Inventory Intelligence Platform</div>
        </div>

        <div class="login-card">
            <div class="card-header">
                <div class="card-title">Welcome Back</div>
                <div class="card-subtitle">Sign in to access your inventory dashboard</div>
            </div>

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="form-footer">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label class="checkbox-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="signInBtn">
                    <span class="btn-spinner" id="btnSpinner"></span>
                    <span id="btnText">Sign In</span>
                </button>

                <div class="security-badge">
                    <svg class="security-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                    <span>Secured with 256-bit encryption</span>
                </div>
            </form>
        </div>

        <div class="footer-text">
            Need access? <a href="#">Contact your administrator</a>
        </div>
    </div>

    <script>
        const form     = document.getElementById('loginForm');
        const btn      = document.getElementById('signInBtn');
        const spinner  = document.getElementById('btnSpinner');
        const btnText  = document.getElementById('btnText');
        const overlay  = document.getElementById('loadingOverlay');
        const bar      = document.getElementById('loadingBar');
        const loadTxt  = document.getElementById('loadingText');

        const steps = [
            { pct: 20,  msg: 'Authenticating…' },
            { pct: 45,  msg: 'Loading inventory data…' },
            { pct: 70,  msg: 'Building dashboard…' },
            { pct: 90,  msg: 'Almost ready…' },
            { pct: 100, msg: 'Redirecting…' }
        ];

        form.addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) return; // let browser handle required

            // Show button spinner
            spinner.style.display = 'block';
            btnText.textContent = 'Signing in…';
            btn.disabled = true;

            // Show loading overlay after tiny delay (form submits naturally)
            setTimeout(() => {
                overlay.classList.add('active');
                let i = 0;
                function advance() {
                    if (i >= steps.length) return;
                    bar.style.width = steps[i].pct + '%';
                    loadTxt.textContent = steps[i].msg;
                    i++;
                    if (i < steps.length) setTimeout(advance, 320);
                }
                advance();
            }, 80);
            // Form submits normally to Flask POST
        });
    </script>
</body>
</html>
